name: Deploy Work API to dev

on:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: work-api-dev-deploy
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      ENV_NAME: ${{ github.ref_name == 'develop' && 'dev' || '' }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build the Cloud Run image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: work-api-${{ env.ENV_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=work-api-dev
          cache-to: type=gha,scope=work-api-dev,mode=max,ignore-error=true
      - name: Authenticate the dev deployer
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - name: Publish the image and roll out the dev revision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GCP_PROJECT_ID: ${{ steps.auth.outputs.project_id }}
        run: |
          branch_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/develop" --jq '.object.sha')"
          if [[ "$branch_sha" != "$GITHUB_SHA" ]]; then
            printf 'Skipping deployment because develop has advanced.\n'
            exit 0
          fi
          bash .github/scripts/deploy-work-api-dev.sh
