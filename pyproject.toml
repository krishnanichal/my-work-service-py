[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "my-work-service-py"
version = "0.1.0"
description = "FastAPI service for My Work"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.16.5,<2",
    "asyncpg>=0.31.0,<1",
    "fastapi>=0.142.2",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.44,<2.1",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "bandit",
    "httpx2",
    "mypy",
    "pip-audit",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/api"]
addopts = "-ra --strict-markers"
markers = [
    "regression: reproduces a previously fixed defect",
    "integration: exercises application and infrastructure boundaries",
    "e2e: exercises complete API workflows",
]

[tool.coverage.run]
branch = true
relative_files = true
source = ["app"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "ASYNC"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "alembic"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "asyncpg.exceptions"
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]
